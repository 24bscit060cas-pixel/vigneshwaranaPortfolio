        }

        .container {
            background-color: white;
            padding: 30px;
            max-width: 600px;
            margin: 50px auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);

        h1 {
            color: #333;
        }

        h2 {

        }

        ul {
            list-style: none;

        }

        button {
            margin-top: 25px;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
